name: Release

# Runs only when a version tag is pushed. It never runs on pull requests or
# branch pushes. It builds the release files and creates a DRAFT GitHub release
# so the maintainer can review the files and publish it by hand.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag must match VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$(cat VERSION)" || { echo "Tag $TAG does not match VERSION $(cat VERSION)" >&2; exit 1; }
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Public-source privacy check
        run: python3 scripts/check-public-tree.py
      - name: Static distribution checks
        run: tests/test-distribution.sh
      - name: Python regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Bootstrap and release package checks
        run: |
          sudo tests/test-get-vesselstack.sh
          tests/test-build-package.sh
      - name: Build and verify release files
        run: |
          VESSELSTACK_BUILD_REQUIRE_CLEAN=true ./build-package.sh
          cd generated
          sha256sum -c "vesselstack-$(cat ../VERSION).tar.gz.sha256"
          sha256sum -c get-vesselstack.sh.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=$(cat VERSION)
          gh release create "$TAG" \
            "generated/vesselstack-$v.tar.gz" \
            "generated/vesselstack-$v.tar.gz.sha256" \
            generated/get-vesselstack.sh \
            generated/get-vesselstack.sh.sha256 \
            --draft --verify-tag --title "VesselStack $v" \
            --notes "Release files for VesselStack $v. Review, then publish. See CHANGELOG.md."
