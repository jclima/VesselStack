name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml so a release runs exactly the suites CI runs.
  workflow_call:

permissions:
  contents: read

jobs:
  readme-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require README update
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          grep -qx 'README.md' <<<"$changed" || {
            echo "Every pull request must update README.md." >&2
            exit 1
          }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Public-source privacy check
        run: python3 scripts/check-public-tree.py
      - name: Static distribution checks
        run: tests/test-distribution.sh
      - name: Lifecycle backup and restore checks
        run: sudo tests/test-lifecycle.sh
      - name: Versioned migration checks
        run: tests/test-migrations.sh
      - name: Clean installation checks
        run: sudo tests/test-clean-install.sh
      - name: Offline and transactional install checks
        run: sudo tests/test-offline-install.sh
      - name: Update launcher root-trust checks
        run: sudo tests/test-update-launcher.sh
      - name: Guided bootstrap (get-vesselstack.sh) checks
        run: sudo tests/test-get-vesselstack.sh
      - name: SocketCAN unit rendering checks
        run: tests/test-socketcan.sh
      - name: Release package content checks
        run: tests/test-build-package.sh
      - name: Validate Compose configuration
        run: docker compose --env-file vesselstack.example.env -f templates/compose.yml config --quiet
      - name: Validate optional Compose profiles
        run: docker compose --profile signalk --profile ais --env-file vesselstack.example.env -f templates/compose.yml config --quiet
      - name: Validate Linux ARM64 image manifests
        run: tests/test-image-manifests.sh
      - name: Run all Python regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run control panel UI regression checks
        run: node tests/test_control_panel_ui.cjs
      - name: Build and verify release archive
        run: |
          ./build-package.sh
          (cd generated && sha256sum -c vesselstack-$(cat ../VERSION).tar.gz.sha256)
          test "$(awk '{print $2}' generated/vesselstack-$(cat VERSION).tar.gz.sha256)" = "vesselstack-$(cat VERSION).tar.gz"
          (cd generated && sha256sum -c get-vesselstack.sh.sha256)
          grep -qx "DEFAULT_VERSION=\"$(cat VERSION)\"" generated/get-vesselstack.sh

  service-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Start and verify observability services
        run: tests/test-service-integration.sh
      - name: Verify Mosquitto ACL and display accounts
        run: sudo tests/test-displays-mosquitto.sh
      - name: Verify the Mosquitto upgrade path (old container, reboot, recreate)
        run: sudo tests/test-mosquitto-upgrade.sh
      - name: Verify the SignalK to MQTT displays bridge
        run: sudo tests/test-displays-bridge.sh
      - name: Verify the bridge EnvironmentFile and unit under real systemd
        run: tests/test-displays-envfile-systemd.sh

  displays-esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Pull the pinned ESPHome image
        run: docker pull "$(tr -d '[:space:]' < displays/esphome/IMAGE)"
      - name: Validate generated display projects with the pinned ESPHome
        run: tests/test-displays-esphome-config.sh
