<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">VesselStack owner-level architecture map</title>
  <desc id="map-desc">Sensors and Signal K feed onboard services, local history, dashboards, and Boat Chat. An optional separately configured Signal K plugin can send selected readings to a VesselTwin maintenance record.</desc>
  <defs>
    <linearGradient id="map-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071c2c"/><stop offset="1" stop-color="#12394a"/></linearGradient>
    <linearGradient id="map-card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173e4e"/><stop offset="1" stop-color="#102f3e"/></linearGradient>
    <filter id="map-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b13" flood-opacity=".3"/></filter>
    <marker id="map-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7edbd0"/></marker>
    <marker id="map-coral-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#ef8f82"/></marker>
    <pattern id="map-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b8eee7" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1400" height="750" rx="26" fill="url(#map-bg)"/><rect width="1400" height="750" rx="26" fill="url(#map-grid)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#e5faf5"><text x="70" y="76" font-size="16" letter-spacing="3" fill="#7edbd0">HOW IT FITS TOGETHER</text><text x="68" y="132" font-size="42" font-weight="700">From boat data to useful answers</text><text x="70" y="166" font-size="18" fill="#a9c5c6">Readings, history and tools together on your boat.</text></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(70 258)"><rect width="218" height="192" rx="18" fill="url(#map-card)" stroke="#3c7d87"/><text x="24" y="39" font-size="13" letter-spacing="2" fill="#7edbd0">ON THE BOAT</text><text x="24" y="82" font-size="24" fill="#effbf8">Sensors</text><text x="24" y="113" font-size="15" fill="#aacdca">GPS · engine · wind</text><text x="24" y="145" font-size="14" fill="#aacdca">more, when available</text><circle cx="176" cy="143" r="24" fill="#164653" stroke="#7edbd0"/><path d="M162 143h28M176 129v28" stroke="#7edbd0" stroke-width="2"/><text x="24" y="175" font-size="12" fill="#779fa3">ABSTRACT EXAMPLES</text></g>
    <g transform="translate(356 258)"><rect width="238" height="192" rx="18" fill="url(#map-card)" stroke="#3c7d87"/><text x="24" y="39" font-size="13" letter-spacing="2" fill="#7edbd0">ON BOARD</text><text x="24" y="82" font-size="24" fill="#effbf8">Signal K</text><text x="24" y="116" font-size="15" fill="#aacdca">A shared feed for</text><text x="24" y="141" font-size="15" fill="#aacdca">local boat services</text><path d="M171 110c17-22 35-22 51 0M179 128c11-14 22-14 33 0M195 139v1" fill="none" stroke="#7edbd0" stroke-width="3"/></g>
    <g transform="translate(662 222)"><rect width="290" height="268" rx="20" fill="#eaf6f2" stroke="#7edbd0" stroke-width="2"/><text x="28" y="43" font-size="13" letter-spacing="2" fill="#328782">ONBOARD SERVICES</text><text x="28" y="86" font-size="21" fill="#123a47">Home Assistant · MQTT</text><text x="28" y="122" font-size="15" fill="#4e7074">InfluxDB · local tools</text><text x="28" y="150" font-size="15" fill="#4e7074">Automations, history, and</text><text x="28" y="174" font-size="15" fill="#4e7074">services on your hardware.</text><rect x="28" y="202" width="234" height="34" rx="10" fill="#d5eee8"/><circle cx="51" cy="219" r="8" fill="#42b8ae"/><text x="69" y="224" font-size="14" fill="#174851">local-first boundary</text></g>
    <g transform="translate(1018 222)"><rect width="300" height="268" rx="20" fill="#173e4e" stroke="#3c7d87"/><text x="28" y="43" font-size="13" letter-spacing="2" fill="#7edbd0">YOUR VIEWS</text><text x="28" y="86" font-size="23" fill="#effbf8">Dashboards + Boat Chat</text><rect x="28" y="112" width="112" height="94" rx="10" fill="#245362"/><path d="M42 180c18-39 29 7 43-25s21 23 34-12" fill="none" stroke="#7edbd0" stroke-width="3"/><rect x="156" y="112" width="116" height="42" rx="8" fill="#ef8f82" fill-opacity=".23"/><text x="169" y="138" font-size="12" fill="#f8d9d2">Boat Chat</text><rect x="156" y="164" width="116" height="42" rx="8" fill="#d4eee9" fill-opacity=".17"/><text x="169" y="190" font-size="12" fill="#b5dfda">Control Panel</text></g>
  </g>
  <g fill="none" stroke="#7edbd0" stroke-width="3" marker-end="url(#map-arrow)"><path d="M288 354h68"/><path d="M594 354h68"/><path d="M952 354h66"/></g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif"><text x="322" y="337" font-size="12" fill="#8fb6b8">data feed</text><text x="620" y="337" font-size="12" fill="#8fb6b8">local path</text><text x="957" y="337" font-size="12" fill="#8fb6b8">views</text></g>
  <g transform="translate(354 574)"><rect width="692" height="104" rx="18" fill="#173545" stroke="#ef8f82" stroke-width="2" stroke-dasharray="8 7"/><circle cx="36" cy="52" r="16" fill="#ef8f82" fill-opacity=".2" stroke="#ef8f82"/><path d="M28 52h16M36 44v16" stroke="#ef8f82" stroke-width="2"/><text x="70" y="40" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" fill="#f9ddd7">Optional Signal K plugin → VesselTwin maintenance record</text><text x="70" y="68" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#b2c7c8">Separately configured · selected readings only · availability varies</text></g>
  <path d="M475 450v79c0 26 29 45 55 45h-16" fill="none" stroke="#ef8f82" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#map-coral-arrow)"/><text x="501" y="523" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e7aaa0">opt-in outbound link</text>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9fc1c1"><circle cx="72" cy="708" r="5" fill="#7edbd0"/><text x="86" y="713">Signal K feed stays on the onboard path</text><circle cx="470" cy="708" r="5" fill="#ef8f82"/><text x="484" y="713">Selected readings · optional cloud connection</text></g>
</svg>
