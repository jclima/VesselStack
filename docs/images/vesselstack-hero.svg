  <g fill="#dff8f2" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="86" y="88" font-size="15" letter-spacing="3" fill="#7edbd0">ON BOARD · OPEN SOURCE · OWNER CONTROLLED</text>
    <text x="82" y="168" font-size="62" font-weight="700" letter-spacing="-2">VesselStack</text>
    <text x="86" y="222" font-size="29" fill="#a8d8d3">Your boat. One connected view.</text>
    <text x="86" y="278" font-size="17" fill="#a9c5c6">Keep useful boat data close at hand —</text>
    <text x="86" y="304" font-size="17" fill="#a9c5c6">local first, understandable, and yours to connect.</text>
  </g>
