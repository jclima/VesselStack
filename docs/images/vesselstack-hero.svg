<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 560" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">VesselStack — your boat, one connected view</title>
  <desc id="hero-desc">A stylized boat connects to an onboard Raspberry Pi, local dashboards and history, with an optional dashed connection to VesselTwin.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081b2b"/><stop offset="1" stop-color="#10384a"/></linearGradient>
    <linearGradient id="hero-sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#42c7bf" stop-opacity=".18"/><stop offset="1" stop-color="#42c7bf" stop-opacity="0"/></linearGradient>
    <linearGradient id="hero-boat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fbf8"/><stop offset="1" stop-color="#9bd9d0"/></linearGradient>
    <filter id="hero-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020b13" flood-opacity=".35"/></filter>
    <marker id="hero-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7edbd0"/></marker>
    <pattern id="hero-grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#b8eee7" stroke-opacity=".07"/></pattern>
  </defs>
