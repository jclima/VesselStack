name: vesselstack

services:
  signalk:
    profiles: ["signalk"]
    image: cr.signalk.io/signalk/signalk-server:${SIGNALK_VERSION}
    container_name: vesselstack-signalk
    init: true
    restart: unless-stopped
    # Host networking lets SignalK consume SocketCAN interfaces and local NMEA
    # feeds without granting the container broad Docker privileges.
    network_mode: host
    volumes:
      - ${VESSELSTACK_DATA}/signalk:/home/node/.signalk

  ais-catcher:
    profiles: ["ais"]
    image: ${AIS_IMAGE}
    container_name: vesselstack-ais-catcher
    restart: unless-stopped
    command: ${AIS_CATCHER_ARGS}
    devices:
      - ${AIS_DEVICE}:${AIS_DEVICE}
    ports:
      - "${AIS_WEB_PORT:-8100}:8100"
      - "${AIS_TCP_PORT:-5011}:5011"

  homeassistant:
    image: homeassistant/home-assistant:2026.6.4
    container_name: vesselstack-homeassistant
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 60s
    environment:
      TZ: ${BOAT_TIMEZONE}
    volumes:
      - ${VESSELSTACK_DATA}/homeassistant:/config

  influxdb:
    image: influxdb:2.9.1
    container_name: ${INFLUXDB_CONTAINER_NAME:-vesselstack-influxdb}
    restart: unless-stopped
    ports:
      - "${VESSELSTACK_DATA_BIND_ADDRESS:-127.0.0.1}:${INFLUXDB_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_RAW_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      # First-run setup only (ignored once the volume is initialised). Empty or
      # unset means 30d; 0 means keep forever. Existing buckets are changed only
      # by scripts/bootstrap-influx.sh when INFLUXDB_RAW_RETENTION is set.
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RAW_RETENTION:-30d}
    volumes:
      - ${VESSELSTACK_DATA}/influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:13.0.1
    container_name: vesselstack-grafana
    restart: unless-stopped
    ports:
      - "${VESSELSTACK_WEB_BIND_ADDRESS:-0.0.0.0}:${GRAFANA_PORT:-43000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: boatadmin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_HISTORY_BUCKET: ${INFLUXDB_HISTORY_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ${VESSELSTACK_DATA}/grafana:/var/lib/grafana
      - ${VESSELSTACK_ROOT}/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${VESSELSTACK_ROOT}/config/grafana/dashboards:/var/lib/grafana/dashboards:ro

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: vesselstack-prometheus
    restart: unless-stopped
    ports:
      - "${VESSELSTACK_DATA_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Overriding command replaces the image defaults, so they are repeated here.
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ${VESSELSTACK_ROOT}/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${VESSELSTACK_DATA}/prometheus:/prometheus

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: vesselstack-mosquitto
    restart: unless-stopped
    ports:
      - "${VESSELSTACK_DATA_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    volumes:
      - ${VESSELSTACK_ROOT}/config/mosquitto:/mosquitto/config:ro
      - ${VESSELSTACK_DATA}/mosquitto:/mosquitto/data
      - ${VESSELSTACK_ROOT}/config/mosquitto-auth:/mosquitto/auth:ro

  heimdall:
    image: lscr.io/linuxserver/heimdall:v2.8.1-ls357
    container_name: vesselstack-heimdall
    restart: unless-stopped
    ports:
      - "${VESSELSTACK_WEB_BIND_ADDRESS:-0.0.0.0}:${HEIMDALL_PORT:-80}:80"
      - "${VESSELSTACK_WEB_BIND_ADDRESS:-0.0.0.0}:${HEIMDALL_HTTPS_PORT:-443}:443"
    environment:
      PUID: ${VESSELSTACK_UID}
      PGID: ${VESSELSTACK_GID}
      TZ: ${BOAT_TIMEZONE}
    volumes:
      - ${VESSELSTACK_DATA}/heimdall:/config
