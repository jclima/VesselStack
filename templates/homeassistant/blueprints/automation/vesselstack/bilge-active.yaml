blueprint:
  name: VesselStack bilge activity alert
  description: Notify when a selected bilge-pump or high-water sensor remains active.
  domain: automation
  input:
    bilge_sensor:
      name: Bilge or high-water binary sensor
      selector:
        entity:
          filter:
            domain: binary_sensor
    hold_time:
      name: Required duration
      default:
        seconds: 30
      selector:
        duration: {}
    notification_actions:
      name: Notification actions
      description: >-
        What to do when this fires. The default creates a persistent notification
        in Home Assistant, so the blueprint works as-is. To get a phone push
        through the Home Assistant companion app instead, replace it with a
        notify action, for example:
        - action: notify.mobile_app_YOUR_PHONE (message: "Bilge activity")
      default:
        # Example for the companion app (replace YOUR_PHONE with your device name):
        #   - action: notify.mobile_app_YOUR_PHONE
        #     data:
        #       title: VesselStack
        #       message: "Bilge activity"
        - action: persistent_notification.create
          data:
            title: VesselStack
            message: "Bilge activity. VesselStack alerts are a convenience, not a sole alarm system."
      selector:
        action: {}

mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input bilge_sensor
    to: "on"
    for: !input hold_time
action: !input notification_actions
