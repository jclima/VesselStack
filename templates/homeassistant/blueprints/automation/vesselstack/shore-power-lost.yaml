blueprint:
  name: VesselStack shore power lost alert
  description: Notify when a selected shore-power sensor remains disconnected.
  domain: automation
  input:
    shore_power_sensor:
      name: Shore-power binary sensor
      selector:
        entity:
          filter:
            domain: binary_sensor
    hold_time:
      name: Required duration
      default:
        minutes: 2
      selector:
        duration: {}
    notification_actions:
      name: Notification actions
      description: >-
        What to do when this fires. The default creates a persistent notification
        in Home Assistant, so the blueprint works as-is. To get a phone push
        through the Home Assistant companion app instead, replace it with a
        notify action, for example:
        - action: notify.mobile_app_YOUR_PHONE (message: "Shore power lost")
      default:
        # Example for the companion app (replace YOUR_PHONE with your device name):
        #   - action: notify.mobile_app_YOUR_PHONE
        #     data:
        #       title: VesselStack
        #       message: "Shore power lost"
        - action: persistent_notification.create
          data:
            title: VesselStack
            message: "Shore power lost. VesselStack alerts are a convenience, not a sole alarm system."
      selector:
        action: {}

mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input shore_power_sensor
    to: "off"
    for: !input hold_time
action: !input notification_actions
