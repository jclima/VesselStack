# Waveshare ESP32-S3-Touch-LCD-2.8C: hardware only.
# Contract ids: board_display, board_touch, board_backlight, board_i2c.
# Values sourced from the Waveshare ESP-IDF demo (ST7701S.c/.h, GT911.c/.h, TCA9554PWR.c/.h).
# STATUS: verified on one real unit (colours R/G/B/W, orientation, round safe
# area and touch coordinates correct, no knob changes needed; SignalK -> bridge
# -> MQTT -> screen worked end to end). OTA, long-term stability and mDNS were
# not verified. The README ("Hardware bring-up checklist") lists the knobs to
# turn if another unit's picture is wrong.
# The content box (inscribed square) and the layouts live in the board registry
# and the generated UI, not here: this file is hardware only.
substitutions:
  display_width: "480"
  display_height: "480"

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

i2c:
  - id: board_i2c
    sda: GPIO15
    scl: GPIO7
    frequency: 400kHz

# TCA9554 IO expander. Vendor Set_EXIO() is 1-based: EXIO1 -> number 0.
pca9554:
  - id: board_exio
    i2c_id: board_i2c
    address: 0x20

# 3-wire (9-bit) SPI used only to send the ST7701S init sequence.
spi:
  - id: board_lcd_spi
    clk_pin: GPIO2
    mosi_pin: GPIO1

display:
  - platform: mipi_rgb
    id: board_display
    model: CUSTOM
    dimensions:
      width: ${display_width}
      height: ${display_height}
    spi_id: board_lcd_spi
    data_rate: 2MHz
    spi_mode: MODE0
    cs_pin:
      pca9554: board_exio
      number: 2          # EXIO3
    reset_pin:
      pca9554: board_exio
      number: 0          # EXIO1
    pixel_mode: 18bit    # vendor 0x3A 0x66
    color_order: RGB
    invert_colors: false # vendor sends no INVON
    pclk_frequency: 18MHz
    pclk_inverted: false
    de_pin: GPIO40
    hsync_pin: GPIO38
    vsync_pin: GPIO39
    pclk_pin: GPIO41
    hsync_back_porch: 10
    hsync_front_porch: 50
    hsync_pulse_width: 8
    vsync_back_porch: 18
    vsync_front_porch: 8
    vsync_pulse_width: 2
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    update_interval: never
    auto_clear_enabled: false
    # Vendor ST7701S_screen_init(type 1), minus 0x3A/0x36/0x29 which ESPHome appends
    # (PIXFMT from pixel_mode, MADCTL from color_order/transform, INVOFF, SLPOUT, DISPON).
    init_sequence:
      - delay 120ms                              # vendor waits 10ms+100ms after reset; CUSTOM reset_delay is 10ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]     # CMD2 BK3
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]     # CMD2 BK0
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x10, 0x0C]
      - [0xC2, 0x07, 0x0A]
      - [0xC7, 0x00]                             # SDIR: 0x04 mirrors X (source direction)
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x05, 0x12, 0x98, 0x0E, 0x0F, 0x07, 0x07, 0x09, 0x09, 0x23, 0x05, 0x52, 0x0F, 0x67, 0x2C, 0x11]
      - [0xB1, 0x0B, 0x11, 0x97, 0x0C, 0x12, 0x06, 0x06, 0x08, 0x08, 0x22, 0x03, 0x51, 0x11, 0x66, 0x2B, 0x0F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]     # CMD2 BK1
      - [0xB0, 0x5D]
      - [0xB1, 0x3E]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x4E]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x06, 0x30, 0x08, 0x30, 0x05, 0x30, 0x07, 0x30, 0x00, 0x33, 0x33]
      - [0xE2, 0x11, 0x11, 0x33, 0x33, 0xF4, 0x00, 0x00, 0x00, 0xF4, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x11]
      - [0xE4, 0x44, 0x44]
      - [0xE5, 0x0D, 0xF5, 0x30, 0xF0, 0x0F, 0xF7, 0x30, 0xF0, 0x09, 0xF1, 0x30, 0xF0, 0x0B, 0xF3, 0x30, 0xF0]
      - [0xE6, 0x00, 0x00, 0x11, 0x11]
      - [0xE7, 0x44, 0x44]
      - [0xE8, 0x0C, 0xF4, 0x30, 0xF0, 0x0E, 0xF6, 0x30, 0xF0, 0x08, 0xF0, 0x30, 0xF0, 0x0A, 0xF2, 0x30, 0xF0]
      - [0xE9, 0x36, 0x01]
      - [0xEB, 0x00, 0x01, 0xE4, 0xE4, 0x44, 0x88, 0x40]
      - [0xED, 0xFF, 0x10, 0xAF, 0x76, 0x54, 0x2B, 0xCF, 0xFF, 0xFF, 0xFC, 0xB2, 0x45, 0x67, 0xFA, 0x01, 0xFF]
      - [0xEF, 0x08, 0x08, 0x08, 0x45, 0x3F, 0x54]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]     # back to CMD1
      - [0x11]                                   # SLPOUT (vendor order); ESPHome sends a second one later
      - delay 120ms
      - [0x35, 0x00]                             # TEON

touchscreen:
  - platform: gt911
    id: board_touch
    display: board_display
    i2c_id: board_i2c
    address: 0x5D
    interrupt_pin: GPIO16
    reset_pin:
      pca9554: board_exio
      number: 1          # EXIO2

output:
  - platform: ledc
    id: board_backlight_pwm
    pin: GPIO6
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: board_backlight
    name: Backlight
    internal: true   # display ACL only allows writing .../displays/<user>/status
    output: board_backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0s
