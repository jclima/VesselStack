            lv_obj_set_style_text_color(id(p0_bilge_value), lv_color_hex(fg), LV_PART_MAIN);
          }

interval:
  - interval: 1s
    then:
      - script.execute: render_tiles

lvgl:
  displays: [board_display]
  touchscreens: [board_touch]
  buffer_size: 100%
  style_definitions:
    - id: tile_style
      bg_color: 0x101820
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 4
  pages:
    - id: page_0
      bg_color: 0x000000
      widgets:
        - obj:
            id: p0_content
            align: CENTER
            width: 340
            height: 340
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: GRID
              pad_row: 6
              pad_column: 6
              grid_rows: [FR(1), FR(1), FR(1)]
              grid_columns: [FR(1), FR(1), FR(1)]
            widgets:
              - obj:
                  id: p0_anchor_tile
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "Anchor", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_anchor_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "SOG", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_sog_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
                    - label: {text: !literal "kn", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
              - obj:
                  id: p0_depth_tile
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "Depth", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_depth_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
                    - label: {text: !literal "ft", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
              - obj:
                  id: p0_batt_low_tile
                  styles: tile_style
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "Low battery", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_batt_low_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
              - obj:
                  id: p0_house_v_tile
                  styles: tile_style
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "House", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_house_v_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
                    - label: {text: !literal "V", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "AWA", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
                    - label: {id: p0_awa_value, text: "--", text_font: font_status_sm, text_color: 0xFFFFFF, width: 100%, text_align: CENTER, long_mode: CLIP}
                    - label: {text: !literal "\u00B0", text_font: font_small, text_color: 0x9AA5B1, width: 100%, text_align: CENTER, long_mode: DOT}
              - obj:
                  id: p0_bilge_tile
                  styles: tile_style
                  grid_cell_row_pos: 2
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
