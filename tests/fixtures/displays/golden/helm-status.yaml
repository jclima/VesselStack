            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_depth_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_depth_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_batt_low_sev) : 0;
          if (sev != id(ins_batt_low_drawn_sev)) {
            id(ins_batt_low_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_batt_low_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_batt_low_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 40000UL;
          uint8_t sev = fresh ? id(ins_house_v_sev) : 0;
          if (sev != id(ins_house_v_drawn_sev)) {
            id(ins_house_v_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_house_v_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_house_v_value), lv_color_hex(fg), LV_PART_MAIN);
