# Generated by VesselStack (vesselstackctl display render). Do not edit; regenerate
# instead. This file holds no secrets: they are in secrets.yaml next to it.
substitutions:
  device_name: vs-helm
  mqtt_username: vsdisp-helm

esphome:
  name: ${device_name}
  min_version: 2026.10.0

packages:
  board: !include boards/waveshare-esp32-s3-touch-lcd-2.8c.yaml
  app: !include app/vesselstack.yaml

# ---- generated user interface ----
globals:
  - {id: bridge_online, type: bool, initial_value: "false"}
  - {id: ins_anchor_ok, type: bool, initial_value: "false"}
  - {id: ins_anchor_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_anchor_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_anchor_drawn_sev, type: uint8_t, initial_value: "255"}
  - {id: ins_sog_ok, type: bool, initial_value: "false"}
  - {id: ins_sog_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_sog_val, type: std::string, initial_value: '"--"'}
  - {id: ins_depth_ok, type: bool, initial_value: "false"}
  - {id: ins_depth_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_depth_val, type: std::string, initial_value: '"--"'}
  - {id: ins_depth_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_depth_drawn_sev, type: uint8_t, initial_value: "255"}
  - {id: ins_batt_low_ok, type: bool, initial_value: "false"}
  - {id: ins_batt_low_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_batt_low_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_batt_low_drawn_sev, type: uint8_t, initial_value: "255"}
  - {id: ins_house_v_ok, type: bool, initial_value: "false"}
  - {id: ins_house_v_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_house_v_val, type: std::string, initial_value: '"--"'}
  - {id: ins_house_v_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_house_v_drawn_sev, type: uint8_t, initial_value: "255"}
  - {id: ins_awa_ok, type: bool, initial_value: "false"}
  - {id: ins_awa_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_awa_val, type: std::string, initial_value: '"--"'}
  - {id: ins_bilge_ok, type: bool, initial_value: "false"}
  - {id: ins_bilge_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_bilge_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_bilge_drawn_sev, type: uint8_t, initial_value: "255"}

font:
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_status_sm
    size: 30
    bpp: 4
    glyphs: !literal " -.0123456789AKLMNORW"
  - file: fonts/RobotoCondensed-Regular.ttf
    id: font_small
    size: 20
    bpp: 4
    glyphs: !literal " ABDGHLOSVWabcefghiklnoprstuwy\u00B0"

mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
  on_json_message:
    - topic: vesselstack/v1/notifications/anchor
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_anchor_seen) = millis();
            id(ins_anchor_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_anchor_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/sog
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_sog_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_sog_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_sog_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/depth
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_depth_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_depth_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_depth_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_depth_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/batt_low
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_low_seen) = millis();
            id(ins_batt_low_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_low_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/house_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_house_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_house_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_house_v_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_house_v_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/awa
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_awa_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_awa_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_awa_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/bilge
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_bilge_seen) = millis();
            id(ins_bilge_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_bilge_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 20000UL;
            return fresh ? id(ins_sog_val) : std::string("--");
      - lvgl.label.update:
          id: p0_depth_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
            return fresh ? id(ins_depth_val) : std::string("--");
      - lvgl.label.update:
          id: p0_house_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 40000UL;
            return fresh ? id(ins_house_v_val) : std::string("--");
      - lvgl.label.update:
          id: p0_awa_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_awa_ok) && (millis() - id(ins_awa_seen)) < 20000UL;
            return fresh ? id(ins_awa_val) : std::string("--");
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p0_batt_low_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p0_batt_low_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p0_batt_low_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p0_batt_low_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p0_bilge_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p0_bilge_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p0_bilge_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p0_bilge_value
                text: !literal "--"
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_anchor_sev) : 0;
          if (sev != id(ins_anchor_drawn_sev)) {
            id(ins_anchor_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_anchor_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_anchor_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
          uint8_t sev = fresh ? id(ins_depth_sev) : 0;
