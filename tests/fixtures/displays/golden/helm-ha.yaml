mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
        - script.execute: render_header
    - topic: vesselstack/v1/bridge/signalk
      then:
        - lambda: 'id(sk_state) = (x == "connected") ? 1 : (x == "disconnected") ? 2 : 0;'
        - script.execute: render_header
    - topic: vesselstack/v1/bridge/homeassistant
      then:
        - lambda: 'id(ha_state) = (x == "connected") ? 1 : (x == "disconnected") ? 2 : 0;'
        - script.execute: render_header
  on_json_message:
    - topic: vesselstack/v1/notifications/anchor
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_anchor_seen) = millis();
            id(ins_anchor_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_anchor_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/ha/bilge_pump
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_bilge_pump_seen) = millis();
            id(ins_bilge_pump_ok) = strcmp(st, "ok") == 0;
            id(ins_bilge_pump_k) = x["k"] | -1;
            const char *sv = x["sev"] | "unknown";
            id(ins_bilge_pump_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/ha/engine
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_engine_seen) = millis();
            id(ins_engine_ok) = strcmp(st, "ok") == 0;
            id(ins_engine_k) = x["k"] | -1;
            const char *sv = x["sev"] | "unknown";
            id(ins_engine_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/ha/cabin_t
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_cabin_t_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_cabin_t_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_cabin_t_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_cabin_t_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/batt_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_batt_v_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_v_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/batt_soc
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_soc_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_soc_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_batt_soc_val) = buf;
              id(ins_batt_soc_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_soc_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/batt_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_batt_a_val) = buf;
              id(ins_batt_a_num) = x["v"].as<float>();
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/ha/shore_ha
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_shore_ha_seen) = millis();
            id(ins_shore_ha_ok) = strcmp(st, "ok") == 0;
            id(ins_shore_ha_k) = x["k"] | -1;
            const char *sv = x["sev"] | "unknown";
            id(ins_shore_ha_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/solar_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_solar_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_solar_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_solar_a_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/alarms/summary
      then:
        - lambda: |-
            const char *mx = x["max"] | "unknown";
            uint8_t m = strcmp(mx, "ok") == 0 ? 1 : strcmp(mx, "warn") == 0 ? 2 : strcmp(mx, "alarm") == 0 ? 3 : 0;
            int na = x["na"] | 0;
            const char *id0 = x["ids"][0] | "";
            int first = -1;
            if (strcmp(id0, "anchor") == 0) first = 0;
            else if (strcmp(id0, "bilge_pump") == 0) first = 1;
            else if (strcmp(id0, "engine") == 0) first = 2;
            else if (strcmp(id0, "cabin_t") == 0) first = 3;
            else if (strcmp(id0, "batt_v") == 0) first = 4;
            else if (strcmp(id0, "batt_soc") == 0) first = 5;
            else if (strcmp(id0, "batt_a") == 0) first = 6;
            else if (strcmp(id0, "shore_ha") == 0) first = 7;
            else if (strcmp(id0, "solar_a") == 0) first = 8;
            bool rising = m == 3 && (id(summary_max) != 3 || na > id(summary_na));
            id(summary_max) = m;
            id(summary_na) = na;
            id(summary_first) = first;
            id(summary_seen) = millis();
            id(summary_valid) = true;
            if (rising) {
              id(alarm_rising) = true;
              id(alarm_dismissed) = false;
            }
        - if:
            condition:
              lambda: 'return id(alarm_rising);'
            then:
              - lambda: 'id(alarm_rising) = false;'
              - lvgl.page.show:
                  id: page_0
                  animation: NONE
                  time: 0ms
              - light.turn_on:
                  id: board_backlight
                  brightness: 100%
              - lambda: 'id(bl_drawn) = 100;'
        - script.execute: render_alarm
    - topic: vesselstack/v1/bridge/clock
      then:
        - lambda: |-
            const char *hm = x["hm"] | "";
            int h = -1, m = -1;
            if (strlen(hm) == 5 && hm[2] == ':' && isdigit((unsigned char) hm[0]) && isdigit((unsigned char) hm[1]) && isdigit((unsigned char) hm[3]) && isdigit((unsigned char) hm[4])) {
              h = (hm[0] - '0') * 10 + (hm[1] - '0');
              m = (hm[3] - '0') * 10 + (hm[4] - '0');
              if (h > 23 || m > 59) { h = -1; m = -1; }
            }
            id(clock_h) = h;
            id(clock_m) = m;
            id(clock_seen) = millis();
            if (h >= 0 && x["night"].is<bool>()) {
              bool n = x["night"].as<bool>();
              if (n != id(night_sched)) { id(night_sched) = n; id(night_override) = -1; }
            }
        - script.execute: apply_night
        - script.execute: render_header
        - script.execute: apply_power
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_cabin_t_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_cabin_t_ok) && (millis() - id(ins_cabin_t_seen)) < 15000UL;
            return fresh ? id(ins_cabin_t_val) : std::string("--");
      - lvgl.label.update:
          id: p0_batt_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_v_ok) && (millis() - id(ins_batt_v_seen)) < 40000UL;
            return fresh ? id(ins_batt_v_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_v_ok) && (millis() - id(ins_batt_v_seen)) < 40000UL;
            return fresh ? id(ins_batt_v_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_soc_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_soc_ok) && (millis() - id(ins_batt_soc_seen)) < 70000UL;
            return fresh ? id(ins_batt_soc_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL;
            return fresh ? id(ins_batt_a_val) : std::string("--");
      - lvgl.label.update:
          id: p1_solar_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_solar_a_ok) && (millis() - id(ins_solar_a_seen)) < 40000UL;
            return fresh ? id(ins_solar_a_val) : std::string("--");
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p0_anchor_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_pump_ok) && (millis() - id(ins_bilge_pump_seen)) < 15000UL) && id(ins_bilge_pump_k) >= -1 && id(ins_bilge_pump_k) < 2) ? id(ins_bilge_pump_k) : -2) == -2;'
          then:
            - lvgl.label.update:
                id: p0_bilge_pump_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_pump_ok) && (millis() - id(ins_bilge_pump_seen)) < 15000UL) && id(ins_bilge_pump_k) >= -1 && id(ins_bilge_pump_k) < 2) ? id(ins_bilge_pump_k) : -2) == 0;'
          then:
            - lvgl.label.update:
                id: p0_bilge_pump_value
                text: !literal "RUNNING"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_pump_ok) && (millis() - id(ins_bilge_pump_seen)) < 15000UL) && id(ins_bilge_pump_k) >= -1 && id(ins_bilge_pump_k) < 2) ? id(ins_bilge_pump_k) : -2) == 1;'
          then:
            - lvgl.label.update:
                id: p0_bilge_pump_value
                text: !literal "OFF"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_pump_ok) && (millis() - id(ins_bilge_pump_seen)) < 15000UL) && id(ins_bilge_pump_k) >= -1 && id(ins_bilge_pump_k) < 2) ? id(ins_bilge_pump_k) : -2) == -1;'
          then:
            - lvgl.label.update:
                id: p0_bilge_pump_value
                text: !literal "?"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_engine_ok) && (millis() - id(ins_engine_seen)) < 15000UL) && id(ins_engine_k) >= -1 && id(ins_engine_k) < 2) ? id(ins_engine_k) : -2) == -2;'
          then:
            - lvgl.label.update:
                id: p0_engine_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_engine_ok) && (millis() - id(ins_engine_seen)) < 15000UL) && id(ins_engine_k) >= -1 && id(ins_engine_k) < 2) ? id(ins_engine_k) : -2) == 0;'
          then:
            - lvgl.label.update:
                id: p0_engine_value
                text: !literal "CLEAR"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_engine_ok) && (millis() - id(ins_engine_seen)) < 15000UL) && id(ins_engine_k) >= -1 && id(ins_engine_k) < 2) ? id(ins_engine_k) : -2) == 1;'
          then:
            - lvgl.label.update:
                id: p0_engine_value
                text: !literal "DOCK"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_engine_ok) && (millis() - id(ins_engine_seen)) < 15000UL) && id(ins_engine_k) >= -1 && id(ins_engine_k) < 2) ? id(ins_engine_k) : -2) == -1;'
          then:
            - lvgl.label.update:
                id: p0_engine_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return (((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ha_ok) && (millis() - id(ins_shore_ha_seen)) < 15000UL) && id(ins_shore_ha_k) >= -1 && id(ins_shore_ha_k) < 2) ? id(ins_shore_ha_k) : -2) == -2;'
          then:
            - lvgl.label.update:
                id: p1_shore_ha_value
                text: !literal "--"
