            lv_obj_set_style_text_color(id(p6_solar_a_icon), lv_color_hex(n ? 0x6A1600 : 0x9AA5B1), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p6_solar_a_value), lv_color_hex(n ? 0xB02400 : 0xFFFFFF), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p6_solar_a_unit), lv_color_hex(n ? 0x6A1600 : 0x9AA5B1), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(p6_arc), lv_color_hex(n ? 0x1A0800 : 0x263238), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(p6_zone0), lv_color_hex(n ? 0xC00000 : 0xC62828), LV_PART_MAIN);
            lv_obj_set_style_arc_color(id(p6_zone1), lv_color_hex(n ? 0xB06A00 : 0xF2A900), LV_PART_MAIN);
            id(ins_anchor_drawn_sev) = 255;
            id(ins_fuel_drawn_sev) = 255;
            id(ins_fuel_gdrawn) = 255;
            id(ins_water_drawn_sev) = 255;
            id(ins_water_gdrawn) = 255;
            id(ins_lpg_gdrawn) = 255;
            id(ins_waste_gdrawn) = 255;
            id(ins_batt_soc_gdrawn) = 255;
            id(ins_shore_drawn_sev) = 255;
          }
      - if:
          condition:
            lambda: 'return id(night_dirty);'
          then:
            - lambda: 'id(night_dirty) = false;'
            - script.execute: render_tiles
            - script.execute: render_header
            - script.execute: apply_power
  - id: apply_power
    mode: restart
    then:
      - lambda: |-
          int target = 100;
          if (id(night_active)) target = 20;
          if (target != id(bl_drawn)) {
            id(bl_drawn) = target;
            auto call = id(board_backlight).turn_on();
            call.set_brightness(target / 100.0f);
            call.perform();
          }

interval:
  - interval: 1s
    then:
      - script.execute: render_tiles
      - script.execute: apply_night
      - script.execute: render_header
      - script.execute: apply_power

