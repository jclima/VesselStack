mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
        - script.execute: render_header
    - topic: vesselstack/v1/bridge/signalk
      then:
        - lambda: 'id(sk_state) = (x == "connected") ? 1 : (x == "disconnected") ? 2 : 0;'
        - script.execute: render_header
  on_json_message:
    - topic: vesselstack/v1/instruments/sog
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_sog_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_sog_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_sog_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/depth
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_depth_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_depth_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_depth_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/house_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_house_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_house_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_house_v_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/awa
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_awa_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_awa_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_awa_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/anchor
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_anchor_seen) = millis();
            id(ins_anchor_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_anchor_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/fuel
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_fuel_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_fuel_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_fuel_val) = buf;
              id(ins_fuel_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_fuel_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/water
