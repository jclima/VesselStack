            id(ins_shore_seen) = millis();
            id(ins_shore_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_shore_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/solar_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_solar_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_solar_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_solar_a_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/bridge/clock
      then:
        - lambda: |-
            const char *hm = x["hm"] | "";
            int h = -1, m = -1;
            if (strlen(hm) == 5 && hm[2] == ':' && isdigit((unsigned char) hm[0]) && isdigit((unsigned char) hm[1]) && isdigit((unsigned char) hm[3]) && isdigit((unsigned char) hm[4])) {
              h = (hm[0] - '0') * 10 + (hm[1] - '0');
              m = (hm[3] - '0') * 10 + (hm[4] - '0');
              if (h > 23 || m > 59) { h = -1; m = -1; }
            }
            id(clock_h) = h;
            id(clock_m) = m;
            id(clock_seen) = millis();
        - script.execute: apply_night
        - script.execute: render_header
        - script.execute: apply_power
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 20000UL;
            return fresh ? id(ins_sog_val) : std::string("--");
      - lvgl.label.update:
          id: p0_depth_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
