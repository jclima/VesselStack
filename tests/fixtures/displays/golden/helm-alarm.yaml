                    - label: {text: !literal "V", text_font: font_small, text_color: 0x9AA5B1}
        - obj:
            id: p0_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show:
                  id: page_1
                  animation: NONE
                  time: 0ms
    - id: page_1
