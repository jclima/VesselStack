font:
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_grid
    size: 56
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_status_sm
    size: 30
    bpp: 4
    glyphs: !literal " -.0123456789AKLMNORW"
  - file: fonts/RobotoCondensed-Regular.ttf
    id: font_small
    size: 20
    bpp: 4
    glyphs: !literal " ABDGHLOSVWabcefghiklnoprstuwy\u00B0"
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_banner
    size: 48
    bpp: 4
    glyphs: !literal "0123456789+ ALRMS"
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_banner_name
    size: 28
    bpp: 4
    glyphs: !literal " ABDGHLOSVWabcefghiklnoprstuwy\u00B0"

mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
  on_json_message:
    - topic: vesselstack/v1/instruments/sog
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_sog_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_sog_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_sog_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/depth
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_depth_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_depth_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_depth_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_depth_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/awa
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_awa_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_awa_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_awa_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/house_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_house_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_house_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_house_v_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_house_v_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/anchor
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_anchor_seen) = millis();
            id(ins_anchor_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_anchor_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/batt_low
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_low_seen) = millis();
            id(ins_batt_low_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_low_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/bilge
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_bilge_seen) = millis();
            id(ins_bilge_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_bilge_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/alarms/summary
      then:
        - lambda: |-
            const char *mx = x["max"] | "unknown";
            uint8_t m = strcmp(mx, "ok") == 0 ? 1 : strcmp(mx, "warn") == 0 ? 2 : strcmp(mx, "alarm") == 0 ? 3 : 0;
            int na = x["na"] | 0;
            const char *id0 = x["ids"][0] | "";
            int first = -1;
            if (strcmp(id0, "sog") == 0) first = 0;
            else if (strcmp(id0, "depth") == 0) first = 1;
            else if (strcmp(id0, "awa") == 0) first = 2;
            else if (strcmp(id0, "house_v") == 0) first = 3;
            else if (strcmp(id0, "anchor") == 0) first = 4;
            else if (strcmp(id0, "batt_low") == 0) first = 5;
            else if (strcmp(id0, "bilge") == 0) first = 6;
            bool rising = m == 3 && (id(summary_max) != 3 || na > id(summary_na));
            id(summary_max) = m;
            id(summary_na) = na;
            id(summary_first) = first;
            id(summary_seen) = millis();
            id(summary_valid) = true;
            if (rising) {
              id(alarm_rising) = true;
              id(alarm_dismissed) = false;
            }
        - if:
            condition:
              lambda: 'return id(alarm_rising);'
            then:
              - lambda: 'id(alarm_rising) = false;'
              - lvgl.page.show:
                  id: page_1
                  animation: NONE
                  time: 0ms
              - light.turn_on:
                  id: board_backlight
                  brightness: 100%
        - script.execute: render_alarm
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 20000UL;
            return fresh ? id(ins_sog_val) : std::string("--");
      - lvgl.label.update:
          id: p0_depth_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
            return fresh ? id(ins_depth_val) : std::string("--");
      - lvgl.label.update:
          id: p0_awa_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_awa_ok) && (millis() - id(ins_awa_seen)) < 20000UL;
            return fresh ? id(ins_awa_val) : std::string("--");
      - lvgl.label.update:
          id: p0_house_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 40000UL;
            return fresh ? id(ins_house_v_val) : std::string("--");
      - lvgl.label.update:
          id: p1_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 20000UL;
            return fresh ? id(ins_sog_val) : std::string("--");
      - lvgl.label.update:
          id: p1_depth_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
            return fresh ? id(ins_depth_val) : std::string("--");
      - lvgl.label.update:
          id: p1_house_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 40000UL;
            return fresh ? id(ins_house_v_val) : std::string("--");
      - lvgl.label.update:
          id: p1_awa_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_awa_ok) && (millis() - id(ins_awa_seen)) < 20000UL;
            return fresh ? id(ins_awa_val) : std::string("--");
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p1_anchor_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p1_anchor_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p1_anchor_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL) ? id(ins_anchor_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p1_anchor_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p1_batt_low_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p1_batt_low_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p1_batt_low_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL) ? id(ins_batt_low_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p1_batt_low_value
                text: !literal "--"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p1_bilge_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p1_bilge_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p1_bilge_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL) ? id(ins_bilge_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p1_bilge_value
                text: !literal "--"
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 20000UL;
          uint8_t sev = fresh ? id(ins_depth_sev) : 0;
          if (sev != id(ins_depth_drawn_sev)) {
            id(ins_depth_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_depth_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_depth_value), lv_color_hex(fg), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p1_depth_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_depth_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 40000UL;
          uint8_t sev = fresh ? id(ins_house_v_sev) : 0;
          if (sev != id(ins_house_v_drawn_sev)) {
            id(ins_house_v_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p0_house_v_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_house_v_value), lv_color_hex(fg), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p1_house_v_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_house_v_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_anchor_ok) && (millis() - id(ins_anchor_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_anchor_sev) : 0;
          if (sev != id(ins_anchor_drawn_sev)) {
            id(ins_anchor_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p1_anchor_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_anchor_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_low_ok) && (millis() - id(ins_batt_low_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_batt_low_sev) : 0;
          if (sev != id(ins_batt_low_drawn_sev)) {
            id(ins_batt_low_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p1_batt_low_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_batt_low_value), lv_color_hex(fg), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_bilge_ok) && (millis() - id(ins_bilge_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_bilge_sev) : 0;
          if (sev != id(ins_bilge_drawn_sev)) {
            id(ins_bilge_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            lv_obj_set_style_bg_color(id(p1_bilge_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_bilge_value), lv_color_hex(fg), LV_PART_MAIN);
          }
  - id: render_alarm
    mode: restart
    then:
      - lambda: |-
          bool seen = id(summary_valid) && (millis() - id(summary_seen)) < 15000UL;
          if (!seen) {
            id(summary_max) = 0;
            id(summary_na) = 0;
          }
          bool show = seen && id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(summary_max) == 3 && id(summary_na) > 0 && !id(alarm_dismissed);
          id(alarm_idx) = show ? id(summary_first) : -1;
          if (show) {
            char buf[16];
            snprintf(buf, sizeof(buf), "%d%s %s", id(summary_na) > 99 ? 99 : id(summary_na), id(summary_na) > 99 ? "+" : "", id(summary_na) == 1 ? "ALARM" : "ALARMS");
            if (strcmp(lv_label_get_text(id(alarm_banner_count)), buf) != 0) lv_label_set_text(id(alarm_banner_count), buf);
            lv_obj_clear_flag(id(alarm_banner), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(alarm_banner), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_opa(id(alarm_banner), LV_OPA_COVER, LV_PART_MAIN);
            id(alarm_flash) = false;
          }
      - if:
          condition:
            lambda: 'return id(alarm_idx) == -1 && id(alarm_drawn_idx) != -1;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: ""
            - lambda: 'id(alarm_drawn_idx) = -1;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 0 && id(alarm_drawn_idx) != 0;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "SOG"
            - lambda: 'id(alarm_drawn_idx) = 0;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 1 && id(alarm_drawn_idx) != 1;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "Depth"
            - lambda: 'id(alarm_drawn_idx) = 1;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 2 && id(alarm_drawn_idx) != 2;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "AWA"
            - lambda: 'id(alarm_drawn_idx) = 2;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 3 && id(alarm_drawn_idx) != 3;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "House"
            - lambda: 'id(alarm_drawn_idx) = 3;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 4 && id(alarm_drawn_idx) != 4;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "Anchor"
            - lambda: 'id(alarm_drawn_idx) = 4;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 5 && id(alarm_drawn_idx) != 5;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "Low battery"
            - lambda: 'id(alarm_drawn_idx) = 5;'
      - if:
          condition:
            lambda: 'return id(alarm_idx) == 6 && id(alarm_drawn_idx) != 6;'
          then:
            - lvgl.label.update:
                id: alarm_banner_name
                text: !literal "Bilge"
            - lambda: 'id(alarm_drawn_idx) = 6;'

interval:
  - interval: 1s
    then:
      - script.execute: render_tiles
      - script.execute: render_alarm
  - interval: 500ms
    then:
      - lambda: |-
          if (lv_obj_has_flag(id(alarm_banner), LV_OBJ_FLAG_HIDDEN)) return;
          id(alarm_flash) = !id(alarm_flash);
          lv_obj_set_style_bg_opa(id(alarm_banner), id(alarm_flash) ? LV_OPA_40 : LV_OPA_COVER, LV_PART_MAIN);

lvgl:
  displays: [board_display]
  touchscreens: [board_touch]
  buffer_size: 100%
  style_definitions:
    - id: tile_style
      bg_color: 0x101820
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 4
  pages:
    - id: page_0
      bg_color: 0x000000
      widgets:
        - obj:
            id: p0_content
            align: CENTER
            width: 340
            height: 340
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: GRID
              pad_row: 6
              pad_column: 6
              grid_rows: [FR(1), FR(1)]
              grid_columns: [FR(1), FR(1)]
            widgets:
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "SOG", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p0_sog_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "kn", text_font: font_small, text_color: 0x9AA5B1}
              - obj:
                  id: p0_depth_tile
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
