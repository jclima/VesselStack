# Generated by VesselStack (vesselstackctl display render). Do not edit; regenerate
# instead. This file holds no secrets: they are in secrets.yaml next to it.
substitutions:
  device_name: vs-helm
  mqtt_username: vsdisp-helm

esphome:
  name: ${device_name}
  min_version: 2026.10.0

packages:
  board: !include boards/waveshare-esp32-s3-touch-lcd-2.8c.yaml
  app: !include app/vesselstack.yaml

# ---- generated user interface ----
globals:
  - {id: bridge_online, type: bool, initial_value: "false"}
  - {id: ins_fuel_ok, type: bool, initial_value: "false"}
  - {id: ins_fuel_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_fuel_val, type: std::string, initial_value: '"--"'}
  - {id: ins_fuel_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_fuel_num, type: float, initial_value: "0"}
  - {id: ins_fuel_gdrawn, type: uint8_t, initial_value: "255"}
  - {id: ins_water_ok, type: bool, initial_value: "false"}
  - {id: ins_water_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_water_val, type: std::string, initial_value: '"--"'}
  - {id: ins_water_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_water_num, type: float, initial_value: "0"}
  - {id: ins_water_gdrawn, type: uint8_t, initial_value: "255"}
  - {id: ins_waste_ok, type: bool, initial_value: "false"}
  - {id: ins_waste_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_waste_val, type: std::string, initial_value: '"--"'}
  - {id: ins_waste_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_waste_num, type: float, initial_value: "0"}
  - {id: ins_waste_gdrawn, type: uint8_t, initial_value: "255"}
  - {id: ins_lpg_ok, type: bool, initial_value: "false"}
  - {id: ins_lpg_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_lpg_val, type: std::string, initial_value: '"--"'}
  - {id: ins_lpg_num, type: float, initial_value: "0"}
  - {id: ins_lpg_gdrawn, type: uint8_t, initial_value: "255"}

font:
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_single
    size: 96
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_bar
    size: 36
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Regular.ttf
    id: font_small
    size: 20
    bpp: 4
    glyphs: !literal " %FGLPWaelrstu"

mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
  on_json_message:
    - topic: vesselstack/v1/instruments/fuel
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_fuel_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_fuel_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_fuel_val) = buf;
              id(ins_fuel_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_fuel_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/water
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_water_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_water_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_water_val) = buf;
              id(ins_water_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_water_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/waste
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_waste_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_waste_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_waste_val) = buf;
              id(ins_waste_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_waste_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/lpg
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_lpg_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_lpg_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_lpg_val) = buf;
              id(ins_lpg_num) = x["v"].as<float>();
            }
        - script.execute: render_tiles
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_fuel_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_fuel_ok) && (millis() - id(ins_fuel_seen)) < 70000UL;
            return fresh ? id(ins_fuel_val) : std::string("--");
      - lvgl.label.update:
          id: p0_water_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_water_ok) && (millis() - id(ins_water_seen)) < 70000UL;
            return fresh ? id(ins_water_val) : std::string("--");
      - lvgl.label.update:
          id: p0_waste_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_waste_ok) && (millis() - id(ins_waste_seen)) < 70000UL;
            return fresh ? id(ins_waste_val) : std::string("--");
      - lvgl.label.update:
          id: p0_lpg_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_lpg_ok) && (millis() - id(ins_lpg_seen)) < 70000UL;
            return fresh ? id(ins_lpg_val) : std::string("--");
      - lvgl.label.update:
          id: p1_fuel_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_fuel_ok) && (millis() - id(ins_fuel_seen)) < 70000UL;
            return fresh ? id(ins_fuel_val) : std::string("--");
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_fuel_ok) && (millis() - id(ins_fuel_seen)) < 70000UL;
          float n = id(ins_fuel_num);
          float pb = fresh ? 100.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pb > 0.0f)) pb = 0.0f;
          if (pb > 100.0f) pb = 100.0f;
          lv_bar_set_value(id(p0_fuel_bar), lroundf(pb), LV_ANIM_OFF);
          float pa = fresh ? 1000.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pa > 0.0f)) pa = 0.0f;
          if (pa > 1000.0f) pa = 1000.0f;
          lv_arc_set_value(id(p1_arc), lroundf(pa));
          uint8_t g = fresh ? id(ins_fuel_sev) : 0;
          if (g != id(ins_fuel_gdrawn)) {
            id(ins_fuel_gdrawn) = g;
            uint32_t c = 0x37474F;
            if (g == 1) c = 0x1E7B34;
            if (g == 2) c = 0xF2A900;
            if (g == 3) c = 0xC62828;
            if (g == 4) c = 0x2E86C1;
            lv_obj_set_style_bg_color(id(p0_fuel_bar), lv_color_hex(c), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(p1_arc), lv_color_hex(c), LV_PART_INDICATOR);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_water_ok) && (millis() - id(ins_water_seen)) < 70000UL;
          float n = id(ins_water_num);
          float pb = fresh ? 100.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pb > 0.0f)) pb = 0.0f;
          if (pb > 100.0f) pb = 100.0f;
          lv_bar_set_value(id(p0_water_bar), lroundf(pb), LV_ANIM_OFF);
          uint8_t g = fresh ? id(ins_water_sev) : 0;
          if (g != id(ins_water_gdrawn)) {
            id(ins_water_gdrawn) = g;
            uint32_t c = 0x37474F;
            if (g == 1) c = 0x1E7B34;
            if (g == 2) c = 0xF2A900;
            if (g == 3) c = 0xC62828;
            if (g == 4) c = 0x2E86C1;
            lv_obj_set_style_bg_color(id(p0_water_bar), lv_color_hex(c), LV_PART_INDICATOR);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_waste_ok) && (millis() - id(ins_waste_seen)) < 70000UL;
          float n = id(ins_waste_num);
          float pb = fresh ? 100.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pb > 0.0f)) pb = 0.0f;
          if (pb > 100.0f) pb = 100.0f;
          lv_bar_set_value(id(p0_waste_bar), lroundf(pb), LV_ANIM_OFF);
          uint8_t g = fresh ? id(ins_waste_sev) : 0;
          if (g != id(ins_waste_gdrawn)) {
            id(ins_waste_gdrawn) = g;
            uint32_t c = 0x37474F;
            if (g == 1) c = 0x1E7B34;
            if (g == 2) c = 0xF2A900;
            if (g == 3) c = 0xC62828;
            if (g == 4) c = 0x2E86C1;
            lv_obj_set_style_bg_color(id(p0_waste_bar), lv_color_hex(c), LV_PART_INDICATOR);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_lpg_ok) && (millis() - id(ins_lpg_seen)) < 70000UL;
          float n = id(ins_lpg_num);
          float pb = fresh ? 100.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pb > 0.0f)) pb = 0.0f;
          if (pb > 100.0f) pb = 100.0f;
          lv_bar_set_value(id(p0_lpg_bar), lroundf(pb), LV_ANIM_OFF);
          uint8_t g = fresh ? 4 : 0;
          if (g != id(ins_lpg_gdrawn)) {
            id(ins_lpg_gdrawn) = g;
            uint32_t c = 0x37474F;
            if (g == 1) c = 0x1E7B34;
            if (g == 2) c = 0xF2A900;
            if (g == 3) c = 0xC62828;
            if (g == 4) c = 0x2E86C1;
            lv_obj_set_style_bg_color(id(p0_lpg_bar), lv_color_hex(c), LV_PART_INDICATOR);
          }

interval:
  - interval: 1s
    then:
      - script.execute: render_tiles

lvgl:
  displays: [board_display]
  touchscreens: [board_touch]
  buffer_size: 100%
