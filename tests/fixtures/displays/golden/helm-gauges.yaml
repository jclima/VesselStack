    - id: page_0
      bg_color: 0x000000
      widgets:
        - obj:
            id: p0_content
            align: CENTER
            width: 340
            height: 340
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout: {type: FLEX, flex_flow: ROW, flex_align_main: SPACE_EVENLY, flex_align_cross: CENTER}
