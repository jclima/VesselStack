# Generated by VesselStack (vesselstackctl display render). Do not edit; regenerate
# instead. This file holds no secrets: they are in secrets.yaml next to it.
substitutions:
  device_name: vs-helm
  mqtt_username: vsdisp-helm

esphome:
  name: ${device_name}
  min_version: 2026.10.0

packages:
  board: !include boards/waveshare-esp32-s3-touch-lcd-2.8c.yaml
  app: !include app/vesselstack.yaml

# ---- generated user interface ----
globals:
  - {id: bridge_online, type: bool, initial_value: "false"}
  - {id: ins_batt_v_ok, type: bool, initial_value: "false"}
  - {id: ins_batt_v_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_batt_v_val, type: std::string, initial_value: '"--"'}
  - {id: ins_batt_v_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_batt_soc_ok, type: bool, initial_value: "false"}
  - {id: ins_batt_soc_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_batt_soc_val, type: std::string, initial_value: '"--"'}
  - {id: ins_batt_soc_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_batt_soc_num, type: float, initial_value: "0"}
  - {id: ins_batt_soc_gdrawn, type: uint8_t, initial_value: "255"}
  - {id: ins_batt_a_ok, type: bool, initial_value: "false"}
  - {id: ins_batt_a_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_batt_a_val, type: std::string, initial_value: '"--"'}
  - {id: ins_batt_a_num, type: float, initial_value: "0"}
  - {id: ins_shore_a_ok, type: bool, initial_value: "false"}
  - {id: ins_shore_a_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_shore_a_val, type: std::string, initial_value: '"--"'}
  - {id: ins_shore_a_num, type: float, initial_value: "0"}
  - {id: ins_shore_a_sdrawn, type: uint8_t, initial_value: "255"}
  - {id: ins_shore_ok, type: bool, initial_value: "false"}
  - {id: ins_shore_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_shore_sev, type: uint8_t, initial_value: "0"}
  - {id: ins_shore_drawn_sev, type: uint8_t, initial_value: "255"}
  - {id: ins_solar_a_ok, type: bool, initial_value: "false"}
  - {id: ins_solar_a_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_solar_a_val, type: std::string, initial_value: '"--"'}
  - {id: touch_ignore, type: bool, initial_value: "false"}
  - {id: bl_drawn, type: int, initial_value: "-1"}
  - {id: night_override, type: int, initial_value: "-1"}
  - {id: night_active, type: bool, initial_value: "false"}
  - {id: night_drawn, type: int, initial_value: "-1"}
  - {id: night_dirty, type: bool, initial_value: "false"}
  - {id: clock_h, type: int, initial_value: "-1"}
  - {id: clock_m, type: int, initial_value: "-1"}
  - {id: clock_seen, type: uint32_t, initial_value: "0"}
  - {id: sk_state, type: uint8_t, initial_value: "0"}
  - {id: clock_drawn, type: int, initial_value: "-2"}
  - {id: hdr_drawn, type: int, initial_value: "-1"}

font:
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_grid
    size: 56
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Regular.ttf
    id: font_small
    size: 20
    bpp: 4
    glyphs: !literal " %-.0123456789:ACDFGHKLMNOPRSVWaehlnorstuw"

mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
        - script.execute: render_header
    - topic: vesselstack/v1/bridge/signalk
      then:
        - lambda: 'id(sk_state) = (x == "connected") ? 1 : (x == "disconnected") ? 2 : 0;'
        - script.execute: render_header
  on_json_message:
    - topic: vesselstack/v1/instruments/batt_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_batt_v_val) = buf;
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_v_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/batt_soc
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_soc_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_soc_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_batt_soc_val) = buf;
              id(ins_batt_soc_num) = x["v"].as<float>();
            }
            const char *sv = x["sev"] | "unknown";
            id(ins_batt_soc_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/batt_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_batt_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_batt_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_batt_a_val) = buf;
              id(ins_batt_a_num) = x["v"].as<float>();
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/shore_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_shore_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_shore_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_shore_a_val) = buf;
              id(ins_shore_a_num) = x["v"].as<float>();
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/notifications/shore
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_shore_seen) = millis();
            id(ins_shore_ok) = strcmp(st, "ok") == 0;
            const char *sv = x["sev"] | "unknown";
            id(ins_shore_sev) = strcmp(sv, "ok") == 0 ? 1 : strcmp(sv, "warn") == 0 ? 2 : strcmp(sv, "alarm") == 0 ? 3 : 0;
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/solar_a
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_solar_a_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_solar_a_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_solar_a_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/bridge/clock
      then:
        - lambda: |-
            const char *hm = x["hm"] | "";
            int h = -1, m = -1;
            if (strlen(hm) == 5 && hm[2] == ':' && isdigit((unsigned char) hm[0]) && isdigit((unsigned char) hm[1]) && isdigit((unsigned char) hm[3]) && isdigit((unsigned char) hm[4])) {
              h = (hm[0] - '0') * 10 + (hm[1] - '0');
              m = (hm[3] - '0') * 10 + (hm[4] - '0');
              if (h > 23 || m > 59) { h = -1; m = -1; }
            }
            id(clock_h) = h;
            id(clock_m) = m;
            id(clock_seen) = millis();
        - script.execute: apply_night
        - script.execute: render_header
        - script.execute: apply_power
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_batt_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_v_ok) && (millis() - id(ins_batt_v_seen)) < 40000UL;
            return fresh ? id(ins_batt_v_val) : std::string("--");
      - lvgl.label.update:
          id: p0_batt_soc_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_soc_ok) && (millis() - id(ins_batt_soc_seen)) < 70000UL;
            return fresh ? id(ins_batt_soc_val) : std::string("--");
      - lvgl.label.update:
          id: p0_batt_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL;
            return fresh ? id(ins_batt_a_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_v_ok) && (millis() - id(ins_batt_v_seen)) < 40000UL;
            return fresh ? id(ins_batt_v_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_soc_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_soc_ok) && (millis() - id(ins_batt_soc_seen)) < 70000UL;
            return fresh ? id(ins_batt_soc_val) : std::string("--");
      - lvgl.label.update:
          id: p1_batt_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL;
            return fresh ? id(ins_batt_a_val) : std::string("--");
      - lvgl.label.update:
          id: p2_batt_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_v_ok) && (millis() - id(ins_batt_v_seen)) < 40000UL;
            return fresh ? id(ins_batt_v_val) : std::string("--");
      - lvgl.label.update:
          id: p2_batt_soc_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_soc_ok) && (millis() - id(ins_batt_soc_seen)) < 70000UL;
            return fresh ? id(ins_batt_soc_val) : std::string("--");
      - lvgl.label.update:
          id: p2_batt_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL;
            return fresh ? id(ins_batt_a_val) : std::string("--");
      - lvgl.label.update:
          id: p2_solar_a_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_solar_a_ok) && (millis() - id(ins_solar_a_seen)) < 40000UL;
            return fresh ? id(ins_solar_a_val) : std::string("--");
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ok) && (millis() - id(ins_shore_seen)) < 15000UL) ? id(ins_shore_sev) : 0) == 3;'
          then:
            - lvgl.label.update:
                id: p2_shore_value
                text: !literal "ALARM"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ok) && (millis() - id(ins_shore_seen)) < 15000UL) ? id(ins_shore_sev) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p2_shore_value
                text: !literal "WARN"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ok) && (millis() - id(ins_shore_seen)) < 15000UL) ? id(ins_shore_sev) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p2_shore_value
                text: !literal "OK"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ok) && (millis() - id(ins_shore_seen)) < 15000UL) ? id(ins_shore_sev) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p2_shore_value
                text: !literal "--"
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_soc_ok) && (millis() - id(ins_batt_soc_seen)) < 70000UL;
          float n = id(ins_batt_soc_num);
          float pa = fresh ? 1000.0f * (n - 0.0f) / (100.0f - 0.0f) : 0.0f;
          if (!(pa > 0.0f)) pa = 0.0f;
          if (pa > 1000.0f) pa = 1000.0f;
          lv_arc_set_value(id(p0_arc), lroundf(pa));
          lv_arc_set_value(id(p1_arc), lroundf(pa));
          lv_arc_set_value(id(p2_arc), lroundf(pa));
          uint8_t g = fresh ? id(ins_batt_soc_sev) : 0;
          if (g != id(ins_batt_soc_gdrawn)) {
            id(ins_batt_soc_gdrawn) = g;
            uint32_t c = 0x37474F;
            if (g == 1) c = 0x1E7B34;
            if (g == 2) c = 0xF2A900;
            if (g == 3) c = 0xC62828;
            if (g == 4) c = 0x2E86C1;
            if (id(night_active)) {
              c = 0x2A0A00;
              if (g == 1) c = 0x6B3000;
              if (g == 2) c = 0xB06A00;
              if (g == 3) c = 0xC00000;
              if (g == 4) c = 0x8A4A00;
            }
            lv_obj_set_style_arc_color(id(p0_arc), lv_color_hex(c), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(p1_arc), lv_color_hex(c), LV_PART_INDICATOR);
            lv_obj_set_style_arc_color(id(p2_arc), lv_color_hex(c), LV_PART_INDICATOR);
          }
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p0_batt_a_word
                text: !literal "CHG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p0_batt_a_word
                text: !literal "DSG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p0_batt_a_word
                text: !literal ""
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p1_batt_a_word
                text: !literal "CHG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p1_batt_a_word
                text: !literal "DSG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p1_batt_a_word
                text: !literal ""
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p2_batt_a_word
                text: !literal "CHG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p2_batt_a_word
                text: !literal "DSG"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_batt_a_ok) && (millis() - id(ins_batt_a_seen)) < 40000UL) ? (id(ins_batt_a_num) > 0.05f ? 1 : id(ins_batt_a_num) < -0.05f ? 2 : 0) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p2_batt_a_word
                text: !literal ""
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_a_ok) && (millis() - id(ins_shore_a_seen)) < 40000UL) ? (id(ins_shore_a_num) > 0.5f ? 1 : 2) : 0) == 1;'
          then:
            - lvgl.label.update:
                id: p1_shore_a_value
                text: !literal "ON"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_a_ok) && (millis() - id(ins_shore_a_seen)) < 40000UL) ? (id(ins_shore_a_num) > 0.5f ? 1 : 2) : 0) == 2;'
          then:
            - lvgl.label.update:
                id: p1_shore_a_value
                text: !literal "OFF"
      - if:
          condition:
            lambda: 'return ((id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_a_ok) && (millis() - id(ins_shore_a_seen)) < 40000UL) ? (id(ins_shore_a_num) > 0.5f ? 1 : 2) : 0) == 0;'
          then:
            - lvgl.label.update:
                id: p1_shore_a_value
                text: !literal "--"
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_a_ok) && (millis() - id(ins_shore_a_seen)) < 40000UL;
          uint8_t s = fresh ? (id(ins_shore_a_num) > 0.5f ? 1 : 2) : 0;
          if (s != id(ins_shore_a_sdrawn)) {
            id(ins_shore_a_sdrawn) = s;
            uint32_t c = 0x37474F;
            if (s == 1) c = 0x1E7B34;
            if (s == 2) c = 0x2E86C1;
            if (id(night_active)) {
              c = 0x2A0A00;
              if (s == 1) c = 0x6B3000;
              if (s == 2) c = 0x8A4A00;
            }
            lv_obj_set_style_bg_color(id(p1_shore_a_tile), lv_color_hex(c), LV_PART_MAIN);
          }
      - lambda: |-
          bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_shore_ok) && (millis() - id(ins_shore_seen)) < 15000UL;
          uint8_t sev = fresh ? id(ins_shore_sev) : 0;
          if (sev != id(ins_shore_drawn_sev)) {
            id(ins_shore_drawn_sev) = sev;
            uint32_t bg = 0x37474F, fg = 0x9AA5B1;
            if (sev == 1) { bg = 0x1E7B34; fg = 0xFFFFFF; }
            if (sev == 2) { bg = 0xF2A900; fg = 0x000000; }
            if (sev == 3) { bg = 0xC62828; fg = 0xFFFFFF; }
            if (id(night_active)) {
              bg = 0x000000; fg = 0x5A1200;
              if (sev == 1) { bg = 0x2A0800; fg = 0xC02800; }
              if (sev == 2) { bg = 0x7A3E00; fg = 0xF0B060; }
              if (sev == 3) { bg = 0xB00000; fg = 0xFFB090; }
            }
            lv_obj_set_style_bg_color(id(p2_shore_tile), lv_color_hex(bg), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p2_shore_value), lv_color_hex(fg), LV_PART_MAIN);
          }
  - id: render_header
    mode: restart
    then:
      - lambda: |-
          bool mq = mqtt::global_mqtt_client->is_connected();
          bool online = id(bridge_online) && mq;
          bool fresh = online && id(clock_h) >= 0 && (millis() - id(clock_seen)) < 15000UL;
          int hm = fresh ? id(clock_h) * 60 + id(clock_m) : -1;
          if (hm != id(clock_drawn)) {
            id(clock_drawn) = hm;
            char buf[8];
            if (hm < 0) snprintf(buf, sizeof(buf), "--:--");
            else snprintf(buf, sizeof(buf), "%02d:%02d", hm / 60, hm % 60);
            lv_label_set_text(id(p0_clock), buf);
            lv_label_set_text(id(p1_clock), buf);
            lv_label_set_text(id(p2_clock), buf);
          }
          // 0 unknown (grey), 1 good, 2 bad; the SignalK flag is retained, so it only counts while the bridge is online
          int dsk = !online ? 0 : (id(sk_state) == 1 ? 1 : (id(sk_state) == 2 ? 2 : 0));
          int dbr = online ? 1 : 2;
          int dmq = mq ? 1 : 2;
          bool nt = id(night_active);
          int state = dsk | (dbr << 2) | (dmq << 4) | (nt ? 64 : 0);
          if (state != id(hdr_drawn)) {
            id(hdr_drawn) = state;
            uint32_t good = (nt ? 0x6B3000 : 0x1E7B34), bad = (nt ? 0xB00000 : 0xC62828), unk = (nt ? 0x2A0A00 : 0x37474F);
            uint32_t hi = (nt ? 0xA02000 : 0xFFFFFF), lo = (nt ? 0x2A0A00 : 0x37474F);
            uint32_t sk = dsk == 1 ? good : (dsk == 2 ? bad : unk);
            uint32_t br = dbr == 1 ? good : bad;
            uint32_t mt = dmq == 1 ? good : bad;
            lv_obj_set_style_bg_color(id(p0_dot_sk), lv_color_hex(sk), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p0_dot_bridge), lv_color_hex(br), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p0_dot_mqtt), lv_color_hex(mt), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_clock), lv_color_hex((nt ? 0xA02000 : 0xFFFFFF)), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p0_title), lv_color_hex((nt ? 0x6A1600 : 0x9AA5B1)), LV_PART_MAIN);
            for (int j = 0; j < 3; j++) lv_obj_set_style_bg_color(lv_obj_get_child(id(p0_pages), j), lv_color_hex(j == 0 ? hi : lo), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p1_dot_sk), lv_color_hex(sk), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p1_dot_bridge), lv_color_hex(br), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p1_dot_mqtt), lv_color_hex(mt), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_clock), lv_color_hex((nt ? 0xA02000 : 0xFFFFFF)), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p1_title), lv_color_hex((nt ? 0x6A1600 : 0x9AA5B1)), LV_PART_MAIN);
            for (int j = 0; j < 3; j++) lv_obj_set_style_bg_color(lv_obj_get_child(id(p1_pages), j), lv_color_hex(j == 1 ? hi : lo), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p2_dot_sk), lv_color_hex(sk), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p2_dot_bridge), lv_color_hex(br), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(p2_dot_mqtt), lv_color_hex(mt), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(p2_clock), lv_color_hex((nt ? 0xA02000 : 0xFFFFFF)), LV_PART_MAIN);
