              grid_rows: [FR(1), FR(1)]
              grid_columns: [FR(1), FR(1)]
            widgets:
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "House", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p2_house_v_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "V", text_font: font_small, text_color: 0x9AA5B1}
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "SOG", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p2_sog_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "kn", text_font: font_small, text_color: 0x9AA5B1}
        - obj:
            id: p2_tap
            x: 0
