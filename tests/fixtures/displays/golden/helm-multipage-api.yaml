# Generated by VesselStack (vesselstackctl display render). Do not edit; regenerate
# instead. This file holds no secrets: they are in secrets.yaml next to it.
substitutions:
  device_name: vs-helm
  mqtt_username: vsdisp-helm

esphome:
  name: ${device_name}
  min_version: 2026.10.0

packages:
  board: !include boards/waveshare-esp32-s3-touch-lcd-2.8c.yaml
  app: !include app/vesselstack.yaml
  api: !include app/api.yaml

# ---- generated user interface ----
globals:
  - {id: bridge_online, type: bool, initial_value: "false"}
  - {id: ins_sog_ok, type: bool, initial_value: "false"}
  - {id: ins_sog_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_sog_val, type: std::string, initial_value: '"--"'}
  - {id: ins_depth_ok, type: bool, initial_value: "false"}
  - {id: ins_depth_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_depth_val, type: std::string, initial_value: '"--"'}
  - {id: ins_awa_ok, type: bool, initial_value: "false"}
  - {id: ins_awa_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_awa_val, type: std::string, initial_value: '"--"'}
  - {id: ins_house_v_ok, type: bool, initial_value: "false"}
  - {id: ins_house_v_seen, type: uint32_t, initial_value: "0"}
  - {id: ins_house_v_val, type: std::string, initial_value: '"--"'}

font:
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_grid
    size: 56
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Bold.ttf
    id: font_value_single
    size: 96
    bpp: 4
    glyphs: !literal "0123456789.- "
  - file: fonts/RobotoCondensed-Regular.ttf
    id: font_small
    size: 20
    bpp: 4
    glyphs: !literal " ADGHOSVWefhknopstu\u00B0"

mqtt:
  on_message:
    - topic: vesselstack/v1/bridge/status
      then:
        - lambda: 'id(bridge_online) = (x == "online");'
        - script.execute: render_tiles
  on_json_message:
    - topic: vesselstack/v1/instruments/sog
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_sog_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_sog_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_sog_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/depth
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_depth_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_depth_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 1);
              id(ins_depth_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/awa
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_awa_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_awa_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 0);
              id(ins_awa_val) = buf;
            }
        - script.execute: render_tiles
    - topic: vesselstack/v1/instruments/house_v
      then:
        - lambda: |-
            const char *st = x["st"] | "missing";
            id(ins_house_v_seen) = millis();
            bool ok = strcmp(st, "ok") == 0 && x["v"].is<float>();
            id(ins_house_v_ok) = ok;
            if (ok) {
              char buf[VALUE_ACCURACY_MAX_LEN];
              value_accuracy_to_buf(buf, x["v"].as<float>(), 2);
              id(ins_house_v_val) = buf;
            }
        - script.execute: render_tiles
  on_disconnect:
    - lambda: 'id(bridge_online) = false;'
    - script.execute: render_tiles

script:
  - id: render_tiles
    mode: restart
    then:
      - lvgl.label.update:
          id: p0_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 28000UL;
            return fresh ? id(ins_sog_val) : std::string("--");
      - lvgl.label.update:
          id: p0_depth_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_depth_ok) && (millis() - id(ins_depth_seen)) < 28000UL;
            return fresh ? id(ins_depth_val) : std::string("--");
      - lvgl.label.update:
          id: p0_awa_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_awa_ok) && (millis() - id(ins_awa_seen)) < 28000UL;
            return fresh ? id(ins_awa_val) : std::string("--");
      - lvgl.label.update:
          id: p1_house_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 28000UL;
            return fresh ? id(ins_house_v_val) : std::string("--");
      - lvgl.label.update:
          id: p2_house_v_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_house_v_ok) && (millis() - id(ins_house_v_seen)) < 28000UL;
            return fresh ? id(ins_house_v_val) : std::string("--");
      - lvgl.label.update:
          id: p2_sog_value
          text: !lambda |-
            bool fresh = id(bridge_online) && mqtt::global_mqtt_client->is_connected() && id(ins_sog_ok) && (millis() - id(ins_sog_seen)) < 28000UL;
            return fresh ? id(ins_sog_val) : std::string("--");

interval:
  - interval: 1s
    then:
      - script.execute: render_tiles

lvgl:
  displays: [board_display]
  touchscreens: [board_touch]
  buffer_size: 100%
  style_definitions:
    - id: tile_style
      bg_color: 0x101820
      bg_opa: COVER
      border_width: 0
      radius: 14
      pad_all: 4
  pages:
    - id: page_0
      bg_color: 0x000000
      widgets:
        - obj:
            id: p0_content
            align: CENTER
            width: 340
            height: 340
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            layout:
              type: GRID
              pad_row: 6
              pad_column: 6
              grid_rows: [FR(1), FR(1)]
              grid_columns: [FR(1), FR(1)]
            widgets:
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "SOG", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p0_sog_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "kn", text_font: font_small, text_color: 0x9AA5B1}
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "Depth", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p0_depth_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "ft", text_font: font_small, text_color: 0x9AA5B1}
              - obj:
                  styles: tile_style
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  scrollable: false
                  layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
                  widgets:
                    - label: {text: !literal "AWA", text_font: font_small, text_color: 0x9AA5B1}
                    - label: {id: p0_awa_value, text: "--", text_font: font_value_grid, text_color: 0xFFFFFF}
                    - label: {text: !literal "\u00B0", text_font: font_small, text_color: 0x9AA5B1}
        - obj:
            id: p0_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show:
                  id: page_1
                  animation: NONE
                  time: 0ms
    - id: page_1
      bg_color: 0x000000
      widgets:
        - obj:
            id: p1_content
            align: CENTER
            width: 340
            height: 340
            styles: tile_style
            scrollable: false
            layout: {type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER}
            widgets:
              - label: {text: !literal "House", text_font: font_small, text_color: 0x9AA5B1}
              - label: {id: p1_house_v_value, text: "--", text_font: font_value_single, text_color: 0xFFFFFF}
              - label: {text: !literal "V", text_font: font_small, text_color: 0x9AA5B1}
        - obj:
            id: p1_tap
            x: 0
            y: 0
            width: 100%
            height: 100%
            bg_opa: TRANSP
            border_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show:
